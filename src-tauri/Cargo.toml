[package]
name = "gilbert-codex"
version = "0.8.2"
description = "GUI-first local agent workspace."
authors = ["Gilbert Codex Contributors"]
edition = "2021"
license-file = "../LICENSE"

[lib]
name = "gilbert_codex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
offline-dictation = ["dep:cpal", "dep:whisper-rs"]
offline-dictation-cuda = ["offline-dictation", "whisper-rs/cuda"]
offline-dictation-vulkan = ["offline-dictation", "whisper-rs/vulkan"]
offline-dictation-gpu = ["offline-dictation-vulkan"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
cpal = { version = "0.17", optional = true }
ed25519-dalek = "2"
portable-pty = "0.9"
reqwest = { version = "0.13.3", features = ["gzip", "json"] }
regex = "1"
sha2 = "0.10"
rfd = "0.15"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["macros"] }
uuid = { version = "1", features = ["v4"] }
whisper-rs = { version = "0.16", optional = true }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.2"
webview2-com = "0.38.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
