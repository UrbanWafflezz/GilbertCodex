name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish, for example v0.8.5.
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_GILBERT_NINE_ROUTER_MODE: cloud
  VITE_GILBERT_REQUIRE_CLOUD_SUBSCRIPTIONS: "true"
  VITE_GILBERT_NINE_ROUTER_DASHBOARD_URL: https://gilbert-nine-router-gateway-4bwbtno2aq-uc.a.run.app
  VITE_GILBERT_NINE_ROUTER_BASE_URL: https://gilbert-nine-router-gateway-4bwbtno2aq-uc.a.run.app/v1
  VITE_GILBERT_BILLING_API_URL: https://gilbert-billing-gateway-811485840625.us-central1.run.app
  VITE_GILBERT_GITHUB_CONNECTOR_URL: https://gilbert-github-connector-4bwbtno2aq-uc.a.run.app
  VITE_GILBERT_GOOGLE_CONNECTOR_URL: https://gilbert-google-connector-4bwbtno2aq-uc.a.run.app
  VITE_GILBERT_DISCORD_CONNECTOR_URL: https://gilbert-discord-connector-4bwbtno2aq-uc.a.run.app

jobs:
  windows:
    name: windows-updater-release
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check private release overlay config
        shell: pwsh
        env:
          GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY: ${{ vars.GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY || secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY }}
          GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN: ${{ secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN }}
        run: |
          if (Test-Path -LiteralPath "src/toolBridge/index.ts") {
            return
          }

          if (-not $env:GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY -or -not $env:GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN) {
            throw "Missing private release overlay. Add GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY as a repository variable or secret, and add GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN as a repository secret, so release builds can restore src/toolBridge and optional local plugin bundles without committing them to the public repo."
          }

      - name: Check out private release overlay
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY || secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY }}
          ref: ${{ vars.GILBERT_PRIVATE_RELEASE_OVERLAY_REF || secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_REF || 'main' }}
          token: ${{ secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN }}
          path: .private-release-overlay

      - name: Install private release overlay
        shell: pwsh
        run: |
          $toolBridgeCandidates = @(
            ".private-release-overlay/src/toolBridge",
            ".private-release-overlay/toolBridge"
          )
          $toolBridgeSource = $toolBridgeCandidates |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ "index.ts") } |
            Select-Object -First 1

          if (-not $toolBridgeSource) {
            throw "The private release overlay did not contain src/toolBridge/index.ts or toolBridge/index.ts."
          }

          if (Test-Path -LiteralPath "src/toolBridge") {
            Remove-Item -LiteralPath "src/toolBridge" -Recurse -Force
          }
          Copy-Item -LiteralPath $toolBridgeSource -Destination "src/toolBridge" -Recurse -Force

          foreach ($optionalPath in @("plugins", ".agents/plugins")) {
            $source = Join-Path ".private-release-overlay" $optionalPath
            if (Test-Path -LiteralPath $source) {
              if (Test-Path -LiteralPath $optionalPath) {
                Remove-Item -LiteralPath $optionalPath -Recurse -Force
              }
              $parent = Split-Path -Parent $optionalPath
              if ($parent) {
                New-Item -ItemType Directory -Force -Path $parent | Out-Null
              }
              Copy-Item -LiteralPath $source -Destination $optionalPath -Recurse -Force
            }
          }

          if (-not (Test-Path -LiteralPath "src/toolBridge/index.ts")) {
            throw "Private release overlay restore did not produce src/toolBridge/index.ts."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install npm dependencies
        run: npm ci

      - name: Verify private release tool bridge is available
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "src/toolBridge/index.ts")) {
            throw "Release builds must include the private local tool bridge. Refusing to ship a public shim installer without tools."
          }

      - name: Check updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY. Add the Tauri updater private key as a repository secret before publishing an auto-update release."
          }

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}"
          }

          if (-not $tag.StartsWith("v")) {
            $tag = "v$tag"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Resolve release notes
        id: release_notes
        shell: pwsh
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          $releaseNotesPath = "docs/releases/$tag.md"

          if (-not (Test-Path $releaseNotesPath)) {
            $version = $tag.TrimStart("v")
            $releaseNotesPath = "docs/releases/$version.md"
          }

          if (Test-Path $releaseNotesPath) {
            $body = Get-Content -LiteralPath $releaseNotesPath -Raw
          } else {
            $body = "Signed Windows x64 installer, macOS app/DMG, Linux deb/AppImage, and updater feed for Gilbert Codex $tag."
          }

          "body<<GILBERT_RELEASE_NOTES" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "GILBERT_RELEASE_NOTES" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate installer artwork
        run: npm run installer:assets

      - name: Prepare offline dictation release assets
        shell: pwsh
        run: |
          function Invoke-CheckedCommand([string]$FilePath, [string[]]$Arguments) {
            & $FilePath @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "$FilePath $($Arguments -join ' ') exited with code $LASTEXITCODE"
            }
          }

          Invoke-CheckedCommand "npm" @("run", "dictation:model")
          Invoke-CheckedCommand "npm" @("run", "dictation:llvm")
          Invoke-CheckedCommand "npm" @("run", "dictation:vulkan-sdk")

          $libClang = Get-ChildItem -LiteralPath ".tools\llvm" -Recurse -Filter "libclang.dll" |
            Select-Object -First 1

          if (-not $libClang) {
            throw "LLVM preparation did not produce libclang.dll for the Whisper bindgen build."
          }

          $vulkanSdk = Get-ChildItem -LiteralPath ".tools\vulkan-sdk" -Directory |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "Lib\vulkan-1.lib") } |
            Select-Object -First 1

          if (-not $vulkanSdk) {
            throw "Vulkan SDK preparation did not produce a usable VULKAN_SDK path."
          }

          New-Item -ItemType Directory -Force -Path "C:\gcn" | Out-Null
          "LIBCLANG_PATH=$($libClang.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VULKAN_SDK=$($vulkanSdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_BUILD_JOBS=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_TARGET_DIR=C:\gcn" | Out-File -FilePath $env:GITHUB_ENV -Append

          $portableGgmlEnv = @{
            SOURCE_DATE_EPOCH = "1"
            GGML_NATIVE = "OFF"
            GGML_SSE42 = "OFF"
            GGML_AVX = "OFF"
            GGML_AVX2 = "OFF"
            GGML_FMA = "OFF"
            GGML_F16C = "OFF"
            GGML_BMI2 = "OFF"
            GGML_AVX_VNNI = "OFF"
            GGML_AVX512 = "OFF"
            GGML_AVX512_VBMI = "OFF"
            GGML_AVX512_VNNI = "OFF"
            GGML_AVX512_BF16 = "OFF"
          }

          foreach ($entry in $portableGgmlEnv.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build signed Windows updater release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release_tag.outputs.tag }}
          releaseName: Gilbert Codex ${{ steps.release_tag.outputs.tag }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          args: --bundles nsis --config src-tauri/tauri.updater.conf.json --features offline-dictation-gpu
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          assetNamePattern: Gilbert-Codex-[version]-[arch][setup][ext]

      - name: Upload installer checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          $version = $tag.TrimStart("v")
          $bundleDirCandidates = @()
          if ($env:CARGO_TARGET_DIR) {
            $bundleDirCandidates += Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis"
          }
          $bundleDirCandidates += "src-tauri/target/release/bundle/nsis"

          $bundleDir = $bundleDirCandidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1

          if (-not $bundleDir) {
            throw "Could not find an NSIS bundle directory. Checked: $($bundleDirCandidates -join ', ')"
          }

          $installer = Get-ChildItem -LiteralPath $bundleDir -File |
            Where-Object { $_.Name -match "^Gilbert-Codex-.+-setup\.exe$" -or $_.Name -match "^Gilbert Codex_.+_x64-setup\.exe$" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "Could not find the NSIS setup executable to checksum."
          }

          function Get-FileHashHex([string]$Path, [string]$Algorithm) {
            $resolvedPath = (Resolve-Path -LiteralPath $Path).Path
            $stream = [System.IO.File]::OpenRead($resolvedPath)
            try {
              $hasher = switch ($Algorithm.ToUpperInvariant()) {
                "SHA1" { [System.Security.Cryptography.SHA1]::Create() }
                "SHA256" { [System.Security.Cryptography.SHA256]::Create() }
                default { throw "Unsupported hash algorithm: $Algorithm" }
              }

              try {
                return ([BitConverter]::ToString($hasher.ComputeHash($stream)) -replace "-", "").ToLowerInvariant()
              } finally {
                $hasher.Dispose()
              }
            } finally {
              $stream.Dispose()
            }
          }

          $assetName = "Gilbert-Codex-$version-x64-setup.exe"
          $hash = Get-FileHashHex -Path $installer.FullName -Algorithm SHA256
          $checksumPath = Join-Path $env:RUNNER_TEMP "$assetName.sha256"
          "$hash  $assetName" | Set-Content -LiteralPath $checksumPath -NoNewline -Encoding ascii
          gh release upload $tag $checksumPath --clobber

  macos:
    name: macos-${{ matrix.asset_arch }}-updater-release
    runs-on: macos-15
    needs: windows
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset_arch: aarch64
          - target: x86_64-apple-darwin
            asset_arch: x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check private release overlay config
        shell: bash
        env:
          GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY: ${{ vars.GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY || secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY }}
          GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN: ${{ secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN }}
        run: |
          if [[ -f "src/toolBridge/index.ts" ]]; then
            exit 0
          fi

          if [[ -z "${GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY:-}" || -z "${GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN:-}" ]]; then
            echo "::error::Missing private release overlay. Add GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY as a repository variable or secret, and add GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN as a repository secret, so release builds can restore src/toolBridge and optional local plugin bundles without committing them to the public repo."
            exit 1
          fi

      - name: Check out private release overlay
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY || secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY }}
          ref: ${{ vars.GILBERT_PRIVATE_RELEASE_OVERLAY_REF || secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_REF || 'main' }}
          token: ${{ secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN }}
          path: .private-release-overlay

      - name: Install private release overlay
        shell: bash
        run: |
          tool_bridge_source=""
          for candidate in ".private-release-overlay/src/toolBridge" ".private-release-overlay/toolBridge"; do
            if [[ -f "${candidate}/index.ts" ]]; then
              tool_bridge_source="${candidate}"
              break
            fi
          done

          if [[ -z "${tool_bridge_source}" ]]; then
            echo "::error::The private release overlay did not contain src/toolBridge/index.ts or toolBridge/index.ts."
            exit 1
          fi

          rm -rf "src/toolBridge"
          mkdir -p "src"
          cp -R "${tool_bridge_source}" "src/toolBridge"

          for optional_path in "plugins" ".agents/plugins"; do
            source_path=".private-release-overlay/${optional_path}"
            if [[ -d "${source_path}" ]]; then
              rm -rf "${optional_path}"
              mkdir -p "$(dirname "${optional_path}")"
              cp -R "${source_path}" "${optional_path}"
            fi
          done

          if [[ ! -f "src/toolBridge/index.ts" ]]; then
            echo "::error::Private release overlay restore did not produce src/toolBridge/index.ts."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Verify private release tool bridge is available
        shell: bash
        run: |
          if [[ ! -f "src/toolBridge/index.ts" ]]; then
            echo "::error::Release builds must include the private local tool bridge. Refusing to ship a public shim installer without tools."
            exit 1
          fi

      - name: Test macOS native desktop paths
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml terminal
          cargo test --manifest-path src-tauri/Cargo.toml ngrok
          cargo test --manifest-path src-tauri/Cargo.toml nine_router
          cargo test --manifest-path src-tauri/Cargo.toml native_path
          cargo test --manifest-path src-tauri/Cargo.toml mcp

      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY. Add the Tauri updater private key as a repository secret before publishing an auto-update release."
            exit 1
          fi

      - name: Check Apple signing and notarization secrets
        id: apple_signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Apple signing/notarization secrets are missing: ${missing[*]}. Building ad-hoc macOS DMG/app updater artifacts without notarization."
            exit 0
          fi

          echo "available=true" >> "${GITHUB_OUTPUT}"

      - name: Note ad-hoc macOS release artifacts
        if: steps.apple_signing.outputs.available != 'true'
        shell: bash
        run: |
          echo "macOS artifacts will be ad-hoc signed and not notarized because Apple Developer signing/notarization secrets are not configured yet."

      - name: Import Apple Developer ID certificate
        if: steps.apple_signing.outputs.available == 'true'
        id: apple_certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="${RUNNER_TEMP}/gilbert-codex-apple-certificate.p12"
          keychain_path="${RUNNER_TEMP}/gilbert-codex-build.keychain"

          if ! printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate_path}" 2>/dev/null; then
            printf '%s' "${APPLE_CERTIFICATE}" | base64 -D > "${certificate_path}"
          fi

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security default-keychain -s "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain_path}"

          signing_identity="$(security find-identity -v -p codesigning "${keychain_path}" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "${signing_identity}" ]]; then
            security find-identity -v -p codesigning "${keychain_path}" || true
            echo "::error::The imported Apple certificate did not contain a Developer ID Application signing identity."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=${signing_identity}" >> "${GITHUB_ENV}"
          echo "signing_identity=${signing_identity}" >> "${GITHUB_OUTPUT}"

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.version }}"
          else
            tag="${{ github.ref_name }}"
          fi

          if [[ "${tag}" != v* ]]; then
            tag="v${tag}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Resolve release notes
        id: release_notes
        shell: bash
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          release_notes_path="docs/releases/${tag}.md"

          if [[ ! -f "${release_notes_path}" ]]; then
            version="${tag#v}"
            release_notes_path="docs/releases/${version}.md"
          fi

          if [[ -f "${release_notes_path}" ]]; then
            body="$(cat "${release_notes_path}")"
          else
            body="Signed Windows x64 installer, macOS app/DMG, Linux deb/AppImage, and updater feed for Gilbert Codex ${tag}."
          fi

          {
            echo "body<<GILBERT_RELEASE_NOTES"
            echo "${body}"
            echo "GILBERT_RELEASE_NOTES"
          } >> "${GITHUB_OUTPUT}"

      - name: Build trusted macOS updater release
        if: steps.apple_signing.outputs.available == 'true'
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release_tag.outputs.tag }}
          releaseName: Gilbert Codex ${{ steps.release_tag.outputs.tag }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          tauriScript: npm run tauri:direct
          args: --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.macos.updater.conf.json
          includeUpdaterJson: true
          assetNamePattern: Gilbert-Codex-[version]-macos-${{ matrix.asset_arch }}[ext]

      - name: Build ad-hoc macOS updater release
        if: steps.apple_signing.outputs.available != 'true'
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release_tag.outputs.tag }}
          releaseName: Gilbert Codex ${{ steps.release_tag.outputs.tag }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          tauriScript: npm run tauri:direct
          args: --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.macos.updater.conf.json
          includeUpdaterJson: true
          assetNamePattern: Gilbert-Codex-[version]-macos-${{ matrix.asset_arch }}[ext]

      - name: Upload macOS checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          version="${tag#v}"
          found=0

          while IFS= read -r artifact; do
            found=1
            case "${artifact}" in
              *.app.tar.gz) ext=".app.tar.gz" ;;
              *.dmg) ext=".dmg" ;;
              *) continue ;;
            esac

            asset_name="Gilbert-Codex-${version}-macos-${{ matrix.asset_arch }}${ext}"
            checksum_path="${RUNNER_TEMP}/${asset_name}.sha256"
            shasum -a 256 "${artifact}" | awk -v name="${asset_name}" '{ print $1 "  " name }' > "${checksum_path}"
            gh release upload "${tag}" "${checksum_path}" --clobber
          done < <(find src-tauri/target -type f \( -name '*.app.tar.gz' -o -name '*.dmg' \) -print)

          if [[ "${found}" -eq 0 ]]; then
            echo "::error::Could not find macOS .app.tar.gz or .dmg artifacts to checksum."
            exit 1
          fi

  linux:
    name: linux-x64-updater-release
    runs-on: ubuntu-22.04
    needs: macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check private release overlay config
        shell: bash
        env:
          GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY: ${{ vars.GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY || secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY }}
          GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN: ${{ secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN }}
        run: |
          if [[ -f "src/toolBridge/index.ts" ]]; then
            exit 0
          fi

          if [[ -z "${GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY:-}" || -z "${GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN:-}" ]]; then
            echo "::error::Missing private release overlay. Add GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY as a repository variable or secret, and add GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN as a repository secret, so release builds can restore src/toolBridge and optional local plugin bundles without committing them to the public repo."
            exit 1
          fi

      - name: Check out private release overlay
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY || secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_REPOSITORY }}
          ref: ${{ vars.GILBERT_PRIVATE_RELEASE_OVERLAY_REF || secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_REF || 'main' }}
          token: ${{ secrets.GILBERT_PRIVATE_RELEASE_OVERLAY_TOKEN }}
          path: .private-release-overlay

      - name: Install private release overlay
        shell: bash
        run: |
          tool_bridge_source=""
          for candidate in ".private-release-overlay/src/toolBridge" ".private-release-overlay/toolBridge"; do
            if [[ -f "${candidate}/index.ts" ]]; then
              tool_bridge_source="${candidate}"
              break
            fi
          done

          if [[ -z "${tool_bridge_source}" ]]; then
            echo "::error::The private release overlay did not contain src/toolBridge/index.ts or toolBridge/index.ts."
            exit 1
          fi

          rm -rf "src/toolBridge"
          mkdir -p "src"
          cp -R "${tool_bridge_source}" "src/toolBridge"

          for optional_path in "plugins" ".agents/plugins"; do
            source_path=".private-release-overlay/${optional_path}"
            if [[ -d "${source_path}" ]]; then
              rm -rf "${optional_path}"
              mkdir -p "$(dirname "${optional_path}")"
              cp -R "${source_path}" "${optional_path}"
            fi
          done

          if [[ ! -f "src/toolBridge/index.ts" ]]; then
            echo "::error::Private release overlay restore did not produce src/toolBridge/index.ts."
            exit 1
          fi

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libsecret-tools \
            libsecret-1-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install npm dependencies
        run: npm ci

      - name: Verify private release tool bridge is available
        shell: bash
        run: |
          if [[ ! -f "src/toolBridge/index.ts" ]]; then
            echo "::error::Release builds must include the private local tool bridge. Refusing to ship a public shim installer without tools."
            exit 1
          fi

      - name: Test Linux native desktop paths
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml terminal
          cargo test --manifest-path src-tauri/Cargo.toml ngrok
          cargo test --manifest-path src-tauri/Cargo.toml nine_router
          cargo test --manifest-path src-tauri/Cargo.toml native_path
          cargo test --manifest-path src-tauri/Cargo.toml mcp

      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY. Add the Tauri updater private key as a repository secret before publishing an auto-update release."
            exit 1
          fi

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.version }}"
          else
            tag="${{ github.ref_name }}"
          fi

          if [[ "${tag}" != v* ]]; then
            tag="v${tag}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Resolve release notes
        id: release_notes
        shell: bash
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          release_notes_path="docs/releases/${tag}.md"

          if [[ ! -f "${release_notes_path}" ]]; then
            version="${tag#v}"
            release_notes_path="docs/releases/${version}.md"
          fi

          if [[ -f "${release_notes_path}" ]]; then
            body="$(cat "${release_notes_path}")"
          else
            body="Signed Windows x64 installer, macOS app/DMG, Linux deb/AppImage, and updater feed for Gilbert Codex ${tag}."
          fi

          {
            echo "body<<GILBERT_RELEASE_NOTES"
            echo "${body}"
            echo "GILBERT_RELEASE_NOTES"
          } >> "${GITHUB_OUTPUT}"

      - name: Build Linux updater release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release_tag.outputs.tag }}
          releaseName: Gilbert Codex ${{ steps.release_tag.outputs.tag }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          tauriScript: npm run tauri:direct
          args: --bundles deb,appimage --config src-tauri/tauri.linux.updater.conf.json
          includeUpdaterJson: true
          assetNamePattern: Gilbert-Codex-[version]-linux-x64[ext]

      - name: Upload Linux checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          version="${tag#v}"
          found=0

          while IFS= read -r artifact; do
            found=1
            case "${artifact}" in
              *.AppImage) ext=".AppImage" ;;
              *.deb) ext=".deb" ;;
              *) continue ;;
            esac

            asset_name="Gilbert-Codex-${version}-linux-x64${ext}"
            checksum_path="${RUNNER_TEMP}/${asset_name}.sha256"
            sha256sum "${artifact}" | awk -v name="${asset_name}" '{ print $1 "  " name }' > "${checksum_path}"
            gh release upload "${tag}" "${checksum_path}" --clobber
          done < <(find src-tauri/target -type f \( -name '*.AppImage' -o -name '*.deb' \) -print)

          if [[ "${found}" -eq 0 ]]; then
            echo "::error::Could not find Linux .deb or .AppImage artifacts to checksum."
            exit 1
          fi

  firebase-release-feed:
    name: publish-firebase-release-feed
    runs-on: ubuntu-22.04
    needs: linux
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require Firebase release publisher credentials
        shell: bash
        env:
          GCP_RELEASE_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [[ -z "${GCP_RELEASE_SERVICE_ACCOUNT_KEY:-}" ]]; then
            echo "::error::Missing GCP_RELEASE_SERVICE_ACCOUNT_KEY. Add a Google service-account JSON key with Storage Object Admin access to the Firebase Storage release bucket before publishing public downloads and the updater feed."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != v* ]]; then
            tag="v${tag}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Download GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.release_tag.outputs.tag }}" --dir .release-assets --clobber
          ls -la .release-assets

      - name: Prepare Firebase Storage release feed
        shell: bash
        env:
          FIREBASE_RELEASE_BUCKET: ${{ vars.FIREBASE_RELEASE_BUCKET || 'gilbertcodex-40428.firebasestorage.app' }}
        run: |
          node scripts/prepare-firebase-release.mjs \
            --assets-dir .release-assets \
            --out-dir .firebase-release \
            --tag "${{ steps.release_tag.outputs.tag }}" \
            --bucket "${FIREBASE_RELEASE_BUCKET}"

      - name: Publish release assets to Firebase Storage
        shell: bash
        env:
          FIREBASE_RELEASE_BUCKET: ${{ vars.FIREBASE_RELEASE_BUCKET || 'gilbertcodex-40428.firebasestorage.app' }}
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          gcloud storage cp --cache-control="no-cache" .firebase-release/releases/latest.json "gs://${FIREBASE_RELEASE_BUCKET}/releases/latest.json"
          gcloud storage cp --cache-control="no-cache" .firebase-release/releases/manifest.json "gs://${FIREBASE_RELEASE_BUCKET}/releases/manifest.json"
          gcloud storage cp --recursive --cache-control="public,max-age=31536000,immutable" ".firebase-release/releases/${tag}" "gs://${FIREBASE_RELEASE_BUCKET}/releases/"
